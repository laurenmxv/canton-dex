name: Daml

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build Daml tools
        run: docker build -t dex-tools contracts
      - name: Build and test contracts
        run: docker run --rm -v "$PWD:/workspace" -w /workspace dex-tools make test
