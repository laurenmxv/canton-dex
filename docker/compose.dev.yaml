name: canton-dex

# Local development: sources are live bind mounts; only tools live in images.
x-backend-development: &backend-development
  image: canton-dex-backend-dev:local
  build:
    context: ../backend
    target: development
  init: true
  volumes:
    - &backend-source ../backend:/app
    - &backend-dependencies /app/node_modules
    - &backend-dist /app/dist
    - &backend-generated /app/src/canton/generated

include:
  - path:
      - ../.deps/cn-localnet/infra/compose.yaml
      - ./localnet/compose.override.yaml

services:
  app-db:
    image: postgres:14
    environment:
      POSTGRES_USER: dex
      POSTGRES_PASSWORD: dex-local
      POSTGRES_DB: dex
    volumes:
      - application-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dex -d dex']
      interval: 3s
      timeout: 3s
      retries: 30
  contract-builder:
    image: canton-dex-daml-tools:3.5.7
    build: ../contracts
    command: [bash, /contracts/scripts/build-contracts.sh]
    volumes:
      - ../contracts:/contracts:ro
      - contract-dars:/dars
  # The sole schema initializer. It also uploads the built DARs and creates the development
  # identities and fixtures, then exits; the API starts after it succeeds.
  contract-bootstrap:
    <<: *backend-development
    command: [node, dist/bootstrap/main.js]
    env_file: [./env/backend.env, ./env/bootstrap.env]
    environment:
      DEX_DAR_DIRECTORY: /dars
    volumes:
      - *backend-source
      - *backend-dependencies
      - *backend-dist
      - *backend-generated
      - contract-dars:/dars:ro
    depends_on:
      app-db: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      application-participant: {condition: service_healthy}
      contract-builder: {condition: service_completed_successfully}
  backend:
    <<: *backend-development
    command: [node, dist/main.js]
    env_file: ./env/backend.env
    environment:
      DEX_DEVELOPMENT_TOKENS_ENABLED: "true"
    ports: ['127.0.0.1:18080:8080']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/actuator/health/readiness').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 90
    depends_on:
      contract-bootstrap: {condition: service_completed_successfully}
  frontend:
    image: canton-dex-frontend:local
    build:
      context: ../frontend
    init: true
    volumes:
      - ../frontend:/app/frontend
      - ../client:/app/client
      - frontend-node-modules:/app/frontend/node_modules
      - client-node-modules:/app/client/node_modules
      # Read-only sources for the architecture docs generator.
      - ../backend/src:/app/backend/src:ro
      - ../contracts/daml:/app/contracts/daml:ro
      - ../docs:/app/docs:ro
      - ./compose.dev.yaml:/app/docker/compose.dev.yaml:ro
      - ./localnet/participant-bootstrap.sc:/app/docker/localnet/participant-bootstrap.sc:ro
    environment:
      DEX_API_ORIGIN: http://backend:8080
      DEX_SNAP_BIND_HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - '127.0.0.1:5180:5180'
      - '127.0.0.1:4040:4040'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all(['http://127.0.0.1:5180/', 'http://127.0.0.1:4040/snap.manifest.json', 'http://127.0.0.1:4040/dist/bundle.js'].map(async url => { const r = await fetch(url); if (!r.ok) throw new Error(url); await r.arrayBuffer(); })).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6
    depends_on:
      backend: {condition: service_healthy}
  backend-tests:
    <<: *backend-development
    # The restart harness reads host-owned mode-0600 recovery files in /app/build.
    user: root
    command: [npm, run, 'test:integration']
    profiles: [test]
    env_file: [./env/backend.env, ./env/bootstrap.env]
    environment:
      DEX_TEST_BASE_URL: http://backend:8080
      DEX_SETTLEMENT_TEST_DATABASE_URL: postgres://dex:dex-local@app-db:5432/dex
      DEX_TOKEN_TEST_DATABASE_URL: postgres://dex:dex-local@app-db:5432/dex
      DEX_RESTART_STATE: ${DEX_RESTART_STATE:-/app/build/restart-unused}
    volumes:
      - *backend-source
      - *backend-dependencies
      - *backend-dist
      - *backend-generated
      - ../backend/build:/app/build
volumes:
  contract-dars:
  application-postgres:
  frontend-node-modules:
  client-node-modules:
